<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ڕۆژی لەدایکبوونت پیرۆز بێت جەواهەر ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffd1dc,#e6ccff,#fff0c9);
  color: #9b285b;
}
main {
  margin: 20px;
  padding: 30px 22px;
  background: #ffffffdf;
  border-radius: 28px;
  box-shadow: 0 10px 35px #9b4c7850;
}
.flowers { font-size: 45px; }
h1 { font-size: 29px; }
p { font-size: 23px; line-height: 2; }
button {
  border: 0;
  border-radius: 30px;
  padding: 15px 24px;
  background: #e94f91;
  color: white;
  font-size: 19px;
}
#message {
  display: none;
  margin-top: 25px;
  font-size: 23px;
  line-height: 2;
}
</style>
</head>
<body>
<main>
  <div class="flowers">🎂🌹💗🌹🎂</div>
  <h1>ڕۆژی لەدایکبوونت پیرۆز بێت جەواهەر ❤️</h1>
  <p>ئەمە سوپرایزەکەی تۆیە 🎁</p>
  <button onclick="document.getElementById('message').style.display='block'">
    کلیک بکە بۆ سوپرایز 🎁
  </button>
  <div id="message">
    روژا ژ دایک بونا تە پیروزی بت بەرمالیا من انشاالله ژمن رە هزار سالی بی و ئەڤە ژی سپرایزەکا بچوکە ژتەڕە شێرا من❤️😘🫂
    <br><br>
    🌹🎂💗
  </div>
</main>
</body>
</html>
